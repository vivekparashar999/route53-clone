# Render Blueprint for the FastAPI backend (free plan).
# The SQLite file lives on the instance disk: it is re-seeded with demo data on every cold start.
services:
  - type: web
    name: vivekparashar-route53-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        value: sqlite:///./route53.db
